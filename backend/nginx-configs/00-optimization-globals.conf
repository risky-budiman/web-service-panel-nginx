# Auto-generated by Nginx Proxy Panel - Global Performance Optimization
# File ini memuat pengaturan global tingkat http untuk memaksimalkan kecepatan transfer & throughput

# 1. Connection Upgrade Mapping
# Mengizinkan WebSocket berfungsi sempurna dan mengosongkan Connection header untuk HTTP biasa
# agar Upstream Keepalive Connection Pooling bekerja maksimal.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# 2. Gzip Compression Berkecepatan Tinggi
# Mengompresi file teks, HTML, CSS, JavaScript, dan JSON sebelum dikirim ke client
# Mengurangi konsumsi bandwidth hingga 70-80% dan mempercepat loading halaman secara signifikan
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rss+xml
    application/vnd.geo+json
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/opentype
    font/truetype
    font/ttf
    image/bmp
    image/svg+xml
    image/x-icon
    text/cache-manifest
    text/css
    text/plain
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/x-cross-domain-policy;

# 3. Kernel TCP Stack Optimization
tcp_nopush on;
tcp_nodelay on;
reset_timedout_connection on;
keepalive_timeout 65s;
keepalive_requests 1000;

# 4. Proxy Global Buffering Tuning
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;
