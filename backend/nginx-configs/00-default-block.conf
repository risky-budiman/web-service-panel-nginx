# Auto-generated by Nginx Proxy Panel
# Blokir akses langsung via IP Publik (Port 80 & 443)
# Hanya akses via domain terdaftar dengan Host Header valid yang dilayani

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Tutup koneksi langsung tanpa payload (hemat resource)
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Gunakan snakeoil cert untuk SSL handshake penolakan
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # Tolak koneksi langsung
    return 444;
}
