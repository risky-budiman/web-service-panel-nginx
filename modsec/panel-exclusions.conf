# ==============================================================================
# Nginx Proxy Panel — Pengecualian rule WAF (false positive) yang tepat sasaran
# Dimuat SEBELUM rules CRS (lihat main.conf).
# Disalin otomatis ke /etc/nginx/modsec/ oleh scripts/setup-modsec.sh
#
# Prinsip: matikan rule HANYA untuk host + path + parameter tertentu,
# jangan mematikan WAF secara keseluruhan.
# Gunakan id di rentang 1000100-1000999 untuk pengecualian.
# ==============================================================================

# ── GenieACS (acs.ids.net.id) ──────────────────────────────────────────────────
# UI GenieACS mengirim query filter bersintaks mirip SQL (AND/OR/NOT/LIKE), mis.
#   HEAD /api/devices/?filter=DeviceID.Manufacturer NOT LIKE "ZTE" AND ...
# yang memicu 942100 (libinjection SQLi). Nonaktifkan deteksi SQLi hanya untuk
# parameter "filter" pada path /api/ di host ini. Parameter lain tetap diperiksa.
SecRule REQUEST_HEADERS:Host "@rx ^acs\.ids\.net\.id(:\d+)?$" \
    "id:1000100,\
    phase:1,\
    pass,\
    nolog,\
    t:none,t:lowercase,\
    chain"
    SecRule REQUEST_FILENAME "@beginsWith /api/" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:filter"
