# ==============================================================================
# Nginx Proxy Panel — Override konfigurasi OWASP CRS
# Dimuat SETELAH crs-setup.conf dan SEBELUM rules CRS (lihat main.conf).
# Disalin otomatis ke /etc/nginx/modsec/ oleh scripts/setup-modsec.sh
# ==============================================================================

# Izinkan method REST standar (PUT/PATCH/DELETE).
# Default CRS hanya GET HEAD POST OPTIONS -> memicu rule 911100 sehingga
# edit/hapus di panel dan aplikasi REST (n8n, GenieACS, dll) diblokir.
SecAction \
    "id:1000001,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"
